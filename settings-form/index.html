<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings Form</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="settings-page">
    <section class="settings-card" aria-labelledby="settings-heading">
      <header class="settings-header">
        <h1 id="settings-heading">Account Settings</h1>
        <p class="settings-subtitle">Update your profile information below.</p>
      </header>

      <form
        id="settings-form"
        class="settings-form"
        novalidate
        aria-describedby="form-status"
      >
        <!-- Full Name -->
        <div class="form-group">
          <label for="full-name">Full Name</label>
          <input
            type="text"
            id="full-name"
            name="fullName"
            autocomplete="name"
            required
            aria-describedby="full-name-error"
          >
          <p id="full-name-error" class="error-message" role="alert" aria-live="polite"></p>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            required
            aria-describedby="email-error"
          >
          <p id="email-error" class="error-message" role="alert" aria-live="polite"></p>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="new-password"
            required
            minlength="8"
            aria-describedby="password-error"
          >
          <p id="password-error" class="error-message" role="alert" aria-live="polite"></p>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input
            type="password"
            id="confirm-password"
            name="confirmPassword"
            autocomplete="new-password"
            required
            aria-describedby="confirm-password-error"
          >
          <p id="confirm-password-error" class="error-message" role="alert" aria-live="polite"></p>
        </div>

        <p id="form-status" class="form-status" role="status" aria-live="polite"></p>

        <button type="submit" class="btn-save">Save Settings</button>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
